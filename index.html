<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>自社コード対応スキャナー</title>
    <!-- 1次元バーコード専用の超高速解析ライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; margin: 0; padding: 0; background-color: #f4f4f9; color: #333; }
        #app { max-width: 600px; margin: 0 auto; padding: 15px; }
        h1 { font-size: 1.3em; color: #1976D2; margin: 10px 0; }
       
        /* カメラ映像とスキャン範囲 */
        #interactive.viewport { width: 100%; height: 260px; position: relative; overflow: hidden; border-radius: 10px; background: #000; }
        #interactive.viewport > video, #interactive.viewport > canvas { width: 100%; height: 100%; object-fit: cover; }
        canvas.drawing, canvas.drawingBuffer { position: absolute; left: 0; top: 0; }

        #result { margin: 12px 0; min-height: 1.2em; font-weight: bold; font-size: 1.1em; padding: 10px; border-radius: 6px; }
        .success { color: #2e7d32; background-color: #e8f5e9; border: 1px solid #c8e6c9; }
        .error { color: #c62828; background-color: #ffebee; border: 1px solid #ffcdd2; }
       
        #control-panel { margin-top: 15px; display: flex; flex-direction: column; gap: 10px; }
        button { border: none; padding: 12px; font-size: 1em; border-radius: 8px; cursor: pointer; color: white; -webkit-appearance: none; font-weight: bold; width: 100%; }
        #export-btn { background-color: #1976D2; }
        #clear-btn { background-color: #e53935; margin-top: 15px; font-size: 0.9em; padding: 8px;}
        #copy-btn { background-color: #f57c00; }
        button:active { opacity: 0.8; }
       
        #history { text-align: left; background-color: white; padding: 15px; border-radius: 8px; border: 1px solid #ddd; margin-top: 15px; }
        #history h2 { margin-top: 0; font-size: 1.1em; display: flex; justify-content: space-between; align-items: center; }
        #record-count { font-weight: normal; font-size: 0.85em; color: #666; }
        #history ul { list-style-type: none; padding: 0; margin: 0; max-height: 180px; overflow-y: auto; }
        #history li { padding: 8px 0; border-bottom: 1px solid #eee; font-family: monospace; display: flex; justify-content: space-between; font-size: 0.9em; }
        #history li span.barcode { color: #222; font-weight: bold; }
        #history li span.timestamp { color: #888; font-size: 0.8em; }
        .tips { font-size: 0.8em; color: #444; margin-top: 5px; text-align: left; background: #eef; padding: 8px; border-radius: 5px; }
    </style>
</head>
<body>
    <div id="app">
        <h1>自社コード対応スキャナー</h1>
       
        <!-- カメラ表示エリア -->
        <div id="interactive" class="viewport"></div>

        <div class="tips">
            💡 <strong>読み取りのコツ:</strong> ピントが合う位置（15cm程度）でカメラ画面内にバーコードを入れてください。自動で検出枠が緑色に反応します。
        </div>

        <div id="result">カメラを準備中...</div>

        <div id="control-panel">
            <button id="copy-btn">記録をクリップボードにコピー</button>
            <button id="export-btn">CSVファイルをダウンロード</button>
        </div>

        <div id="history">
            <h2>記録履歴 <span id="record-count">0 件</span></h2>
            <ul id="history-list"></ul>
            <button id="clear-btn">履歴をすべて消去</button>
        </div>
    </div>

    <script>
        let isProcessing = false;
        const STORAGE_KEY = 'offlineBarcodeHistory';
        const resultDiv = document.getElementById('result');
        const countSpan = document.getElementById('record-count');
        const historyList = document.getElementById('history-list');

        function loadHistory() {
            try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch (e) { return []; }
        }

        function updateHistoryDisplay() {
            const history = loadHistory();
            countSpan.innerText = `${history.length} 件`;
            historyList.innerHTML = '';
           
            history.slice().reverse().forEach(record => {
                const li = document.createElement('li');
                li.innerHTML = `<span class="barcode">${record.barcode}</span><span class="timestamp">${record.timestamp}</span>`;
                historyList.appendChild(li);
            });
        }

        function saveBarcode(barcode) {
            const history = loadHistory();
            const now = new Date();
            const timestamp = `${now.getFullYear()}-${(now.getMonth()+1).toString().padStart(2,'0')}-${now.getDate().toString().padStart(2,'0')} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
            history.push({ barcode: barcode, timestamp: timestamp });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
            updateHistoryDisplay();
        }

        function generateCSVString() {
            const history = loadHistory();
            if (history.length === 0) return '';
            const header = 'バーコード,日時\n';
            const body = history.map(record => `"${record.barcode}","${record.timestamp}"`).join('\n');
            return header + body;
        }

        document.getElementById('export-btn').addEventListener('click', () => {
            const csvString = generateCSVString();
            if (!csvString) { alert('記録データがありません。'); return; }
            const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csvString], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.setAttribute("href", URL.createObjectURL(blob));
            link.setAttribute("download", `barcode_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        document.getElementById('copy-btn').addEventListener('click', () => {
            const csvString = generateCSVString();
            if (!csvString) { alert('記録データがありません。'); return; }
            navigator.clipboard.writeText(csvString).then(() => {
                alert('コピー完了！スプレッドシートやメモ帳にそのまま貼り付けられます。');
            });
        });

        document.getElementById('clear-btn').addEventListener('click', () => {
            if (confirm('すべての履歴を消去しますか？')) {
                localStorage.removeItem(STORAGE_KEY);
                updateHistoryDisplay();
                resultDiv.innerText = '履歴を消去しました';
                resultDiv.className = '';
            }
        });

        updateHistoryDisplay();

        // 1次元バーコード解析エンジン（Quagga2）の初期化
        Quagga.init({
            inputStream: {
                name: "Live",
                type: "LiveStream",
                target: document.querySelector('#interactive'),
                constraints: {
                    facingMode: "environment",
                    width: { min: 1280, ideal: 1920 },
                    height: { min: 720, ideal: 1080 }
                }
            },
            locator: {
                patchSize: "medium",
                halfSample: false // 高解像度解析を維持して小さなコードも拾う
            },
            numOfWorkers: 2,
            decoder: {
                // 自社コードでよく使われる主要フォーマットをすべて有効化
                readers: [
                    "code_128_reader",
                    "code_39_reader",
                    "codabar_reader",
                    "i2of5_reader", // ITFコード
                    "ean_reader",
                    "ean_8_reader"
                ]
            },
            locate: true
        }, function(err) {
            if (err) {
                resultDiv.innerText = "カメラの起動に失敗しました: " + err;
                resultDiv.className = "error";
                return;
            }
            resultDiv.innerText = "バーコードをかざしてください";
            Quagga.start();
        });

        // 緑色の認識枠を描画
        Quagga.onProcessed(function(result) {
            const drawingCtx = Quagga.canvas.ctx.overlay;
            const drawingCanvas = Quagga.canvas.dom.overlay;

            if (result) {
                if (result.boxes) {
                    drawingCtx.clearRect(0, 0, parseInt(drawingCanvas.getAttribute("width")), parseInt(drawingCanvas.getAttribute("height")));
                    result.boxes.filter(box => box !== result.box).forEach(box => {
                        Quagga.ImageDebug.drawPath(box, { x: 0, y: 1 }, drawingCtx, { color: "green", lineWidth: 2 });
                    });
                }
            }
        });

        // 読み込み成功時の処理
        Quagga.onDetected(function(result) {
            const code = result.codeResult.code;
            if (!code || isProcessing) return;

            isProcessing = true;
            resultDiv.innerText = `読み込み完了: ${code}`;
            resultDiv.className = 'success';

            try { saveBarcode(code); } catch (e) {}

            setTimeout(() => {
                isProcessing = false;
                resultDiv.innerText = '次のバーコードをかざしてください';
                resultDiv.className = '';
            }, 1500);
        });
    </script>
</body>
</html>
